set default=0
set timeout=8

menuentry "Try ZAOD OS Live Desktop" {
    linux /live/vmlinuz boot=live components quiet splash username=zaod hostname=zaod
    initrd /live/initrd.img
}

menuentry "ZAOD OS Live Desktop (safe graphics)" {
    linux /live/vmlinuz boot=live components quiet splash username=zaod hostname=zaod nomodeset
    initrd /live/initrd.img
}
