timeout: no
default_entry: 1
serial: yes

/Try ZAOD OS (Live Boot - RAM mode)
    protocol: limine
    path: boot():/kernel/zaod_kernel.elf
    cmdline: zaod.mode=live ram
    module_path: boot():/boot/initramfs.img

/Install ZAOD OS on Device (Permanent Installation Wizard)
    protocol: limine
    path: boot():/kernel/zaod_kernel.elf
    cmdline: zaod.mode=install
    module_path: boot():/boot/initramfs.img
